<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>AstraToonix</title>
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0b0b0f; --bg2:#14141a; --bg3:#1d1d26; --line:#2a2a35;
  --text:#f2f2f5; --mut:#9a9aa8; --red:#E50914; --red2:#b20710;
  --nav-h:62px; --pad:4vw; --card-w:clamp(112px,13vw,190px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}

/* ============ NAVBAR ============ */
.nav{position:fixed;top:0;left:0;right:0;height:var(--nav-h);z-index:50;display:flex;align-items:center;gap:22px;padding:0 var(--pad);
  background:linear-gradient(to bottom,rgba(0,0,0,.85),rgba(0,0,0,0));transition:background .3s}
.nav.solid{background:rgba(11,11,15,.96);box-shadow:0 2px 14px rgba(0,0,0,.5)}
.logoimg{height:34px;width:auto;display:block;max-width:180px;object-fit:contain}
.logo{font-weight:900;font-size:1.55rem;letter-spacing:.5px;color:var(--red);text-transform:uppercase;white-space:nowrap}
.links{display:flex;gap:16px;font-size:.92rem;color:#d6d6de;overflow-x:auto;scrollbar-width:none}
.links::-webkit-scrollbar{display:none}
.links a{white-space:nowrap;padding:4px 0;transition:color .2s}
.links a:hover{color:#fff}
.links a.on{color:#fff;font-weight:700}
.sp{flex:1}
.search{display:flex;align-items:center;border:1px solid transparent;border-radius:4px;transition:all .25s;padding:4px 8px}
.search.open{border-color:#fff;background:rgba(0,0,0,.7)}
.search input{width:0;opacity:0;border:0;outline:0;background:transparent;color:#fff;font-size:.95rem;transition:width .25s,opacity .2s}
.search.open input{width:min(220px,40vw);opacity:1;margin-left:6px}
.ico{background:none;border:0;padding:4px;display:grid;place-items:center}
.ico svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.prof{position:relative}
.avatar{width:32px;height:32px;border-radius:5px;background:linear-gradient(135deg,var(--red),#7a0510);display:grid;place-items:center;font-weight:800;border:0}
.menu{position:absolute;right:0;top:44px;min-width:200px;background:rgba(14,14,18,.97);border:1px solid var(--line);border-radius:8px;padding:8px 0;display:none;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.menu.show{display:block;animation:pop .15s ease}
.menu .who{padding:8px 16px 10px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--mut)}
.menu a,.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:10px 16px;font-size:.9rem;color:#ddd}
.menu a:hover,.menu button:hover{background:var(--bg3);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ============ HERO ============ */
.hero{position:relative;height:min(82vh,760px);min-height:430px;overflow:hidden;background:#000}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s ease;display:flex;align-items:flex-end}
.slide.on{opacity:1;z-index:1}
.slide .bd{position:absolute;inset:0;background-size:cover;background-position:center 20%;transform:scale(1.04);transition:transform 9s ease-out}
.slide.on .bd{transform:scale(1.12)}
.slide::after{content:"";position:absolute;inset:0;background:
  linear-gradient(to right,rgba(11,11,15,.95) 0%,rgba(11,11,15,.55) 40%,rgba(11,11,15,0) 75%),
  linear-gradient(to top,var(--bg) 0%,rgba(11,11,15,0) 38%)}
.hero-in{position:relative;z-index:2;padding:0 var(--pad) 11vh;max-width:min(680px,92vw)}
.hero h1{font-size:clamp(1.9rem,5vw,3.6rem);margin:0 0 10px;line-height:1.05;font-weight:900;text-shadow:0 3px 18px rgba(0,0,0,.7)}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;color:#d4d4dc;font-size:.92rem;margin-bottom:12px}
.rate{color:#46d369;font-weight:800}
.chip{border:1px solid #666;border-radius:3px;padding:0 6px;font-size:.78rem;line-height:1.5;color:#ccc}
.desc{font-size:clamp(.88rem,1.5vw,1.08rem);line-height:1.45;color:#e3e3ea;text-shadow:0 2px 10px rgba(0,0,0,.8);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0 0 18px}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:5px;padding:10px 24px;font-weight:700;font-size:1.02rem;transition:transform .15s,background .2s}
.btn:active{transform:scale(.96)}
.btn svg{width:22px;height:22px}
.btn.play{background:#fff;color:#000}.btn.play:hover{background:#d8d8d8}
.btn.info{background:rgba(109,109,120,.7);color:#fff}.btn.info:hover{background:rgba(109,109,120,.45)}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:var(--red2)}
.btn.ghost{background:rgba(42,42,50,.85);color:#fff;padding:10px 16px}
.btn.ghost.on{background:#fff;color:#000}
.dots{position:absolute;right:var(--pad);bottom:12vh;z-index:3;display:flex;gap:7px}
.dots i{width:26px;height:4px;background:rgba(255,255,255,.3);border-radius:2px;cursor:pointer;transition:background .3s}
.dots i.on{background:#fff}

/* ============ ROWS ============ */
main{position:relative;z-index:2}
.rows{margin-top:-9vh;padding-bottom:50px}
.row{margin:0 0 30px;position:relative}
.row h2{font-size:clamp(1rem,1.7vw,1.35rem);margin:0 var(--pad) 10px;font-weight:700;display:flex;align-items:center;gap:8px}
.row h2 a{font-size:.75rem;color:var(--mut);font-weight:500;opacity:0;transition:opacity .2s}
.row:hover h2 a{opacity:1}
.track-wrap{position:relative}
.track{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scroll-padding-left:var(--pad);scrollbar-width:none;padding:34px var(--pad);margin:-34px 0;cursor:grab}
.track::-webkit-scrollbar{display:none}
.track.drag{cursor:grabbing;scroll-snap-type:none}
.arrow{position:absolute;top:0;bottom:0;width:var(--pad);min-width:34px;z-index:6;border:0;background:rgba(11,11,15,.55);color:#fff;font-size:1.8rem;opacity:0;transition:opacity .2s;display:grid;place-items:center}
.track-wrap:hover .arrow{opacity:1}
.arrow.l{left:0}.arrow.r{right:0}
.arrow:hover{background:rgba(11,11,15,.85)}
@media(hover:none){.arrow{display:none}}

/* ============ CARD ============ */
.card{flex:0 0 var(--card-w);position:relative;scroll-snap-align:start;border-radius:6px;transition:transform .25s ease,box-shadow .25s ease,z-index 0s .25s;cursor:pointer}
.card .ph{position:relative;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--bg3)}
.card img{width:100%;height:100%;object-fit:cover}
.noimg{width:100%;height:100%;display:grid;place-items:center;padding:10px;text-align:center;font-weight:800;font-size:.95rem;color:#fff;line-height:1.2}
.badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.75);font-size:.65rem;padding:2px 6px;border-radius:3px;letter-spacing:.4px;text-transform:uppercase}
.card .ov{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;padding:10px;background:linear-gradient(to top,rgba(0,0,0,.92) 10%,rgba(0,0,0,.25) 55%,rgba(0,0,0,0));opacity:0;transition:opacity .2s}
.card .ov .t{font-weight:700;font-size:.85rem;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ov .m{font-size:.72rem;color:#cfcfd8;display:flex;gap:8px;align-items:center}
.card .ov .a{display:flex;gap:6px}
.rb{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.6);background:rgba(20,20,26,.8);display:grid;place-items:center;padding:0;transition:all .15s}
.rb:hover{border-color:#fff;background:#fff}
.rb svg{width:14px;height:14px;fill:#fff;stroke:#fff;stroke-width:0}
.rb:hover svg{fill:#000;stroke:#000}
.rb.pl{background:#fff}.rb.pl svg{fill:#000}
.rb.on{background:#fff}.rb.on svg{fill:#000}
.rb.st svg{fill:none;stroke-width:2.4;stroke:#fff}
.rb.st:hover svg,.rb.st.on svg{stroke:#000}
@media(hover:hover){
  .card:hover{transform:scale(1.14);z-index:8;box-shadow:0 14px 34px rgba(0,0,0,.75);transition:transform .25s ease,box-shadow .25s ease}
  .card:hover .ov{opacity:1}
  .track .card:first-child:hover{transform-origin:left center}
  .track .card:last-child:hover{transform-origin:right center}
}
.prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}
.prog i{display:block;height:100%;background:var(--red)}
.cwl{font-size:.74rem;color:var(--mut);margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.na{opacity:.45;filter:grayscale(.8);cursor:default}
.card.cur{outline:2px solid var(--red)}

/* top 10 numbers */
.top .card{flex-basis:calc(var(--card-w)*1.5);display:flex;align-items:flex-end;padding-left:calc(var(--card-w)*.46)}
.top .num{position:absolute;left:0;bottom:-8px;font-size:calc(var(--card-w)*1.1);font-weight:900;line-height:1;color:#0b0b0f;-webkit-text-stroke:3px #6c6c78;letter-spacing:-8px}
.top .card .ph{width:calc(var(--card-w)*.95)}

/* ============ GRID / BROWSE ============ */
.page{padding:calc(var(--nav-h) + 26px) var(--pad) 60px;min-height:80vh}
.page h1{margin:0 0 14px;font-size:clamp(1.4rem,3vw,2rem)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 20px}
.fchip{background:var(--bg3);border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:.84rem;color:#ccc;transition:all .2s}
.fchip:hover{border-color:#777;color:#fff}
.fchip.on{background:#fff;color:#000;border-color:#fff}
select.sel{background:var(--bg3);color:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:.85rem;margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));gap:26px 12px}
.grid .card{flex:none;width:auto}
.empty{text-align:center;color:var(--mut);padding:80px 20px}
.empty b{display:block;font-size:1.3rem;color:#fff;margin-bottom:8px}
.more{display:block;margin:26px auto 0}

/* ============ DETAIL ============ */
.dhero{position:relative;min-height:min(78vh,640px);display:flex;align-items:flex-end;background:#000;overflow:hidden}
.dhero .bd{position:absolute;inset:0;background-size:cover;background-position:center 20%;opacity:.85}
.dhero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 2%,rgba(11,11,15,.35) 55%,rgba(11,11,15,.7)),linear-gradient(to right,rgba(11,11,15,.9),rgba(11,11,15,0) 70%)}
.din{position:relative;z-index:2;display:flex;gap:30px;align-items:flex-end;padding:calc(var(--nav-h) + 30px) var(--pad) 30px;width:100%}
.din .poster{width:clamp(120px,19vw,250px);flex:none;border-radius:8px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.7);aspect-ratio:2/3;background:var(--bg3)}
.din .poster img{width:100%;height:100%;object-fit:cover}
.din h1{font-size:clamp(1.7rem,4.2vw,3.2rem);margin:0 0 8px;line-height:1.05;font-weight:900}
.tag{color:#bdbdc8;font-style:italic;margin:0 0 12px}
.body{padding:10px var(--pad) 50px;max-width:1500px}
.body h3{font-size:1.2rem;margin:26px 0 12px}
.body p.ov{line-height:1.6;color:#d6d6de;max-width:900px;margin:0}
.casts{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.cast{flex:0 0 96px;text-align:center}
.cast .pf{width:84px;height:84px;border-radius:50%;overflow:hidden;margin:0 auto 6px;background:var(--bg3);display:grid;place-items:center;font-weight:800;color:var(--mut)}
.cast img{width:100%;height:100%;object-fit:cover}
.cast b{display:block;font-size:.8rem;line-height:1.2}
.cast span{display:block;font-size:.72rem;color:var(--mut);line-height:1.2}
.seasons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ep{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;transition:background .2s,border-color .2s;cursor:pointer}
.ep:hover{background:var(--bg3);border-color:#444}
.ep .pn{width:34px;height:34px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex:none}
.ep .pn svg{width:15px;height:15px;fill:#fff}
.ep .lb{font-weight:700;min-width:70px}
.ep .nm{flex:1;color:var(--mut);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qs{display:flex;gap:6px;flex-wrap:wrap}
.q{background:#000;border:1px solid #555;border-radius:4px;padding:3px 9px;font-size:.76rem;color:#eee}
.q:hover{background:#fff;color:#000}
.back{position:fixed;top:14px;left:14px;z-index:60}

/* ============ LOGIN ============ */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:
  linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.9)),radial-gradient(circle at 20% 20%,#3a0508,#0b0b0f 60%)}
.lbox{width:min(400px,100%);background:rgba(0,0,0,.78);border-radius:10px;padding:46px 40px;border:1px solid var(--line)}
.lbox h1{margin:0 0 22px;font-size:1.9rem}
.lbox input{width:100%;background:#2b2b33;border:1px solid transparent;border-radius:5px;padding:15px 14px;color:#fff;font-size:1rem;margin-bottom:14px;outline:0}
.lbox input:focus{border-color:var(--red)}
.lbox .btn{width:100%;justify-content:center;margin-top:6px}
.lbox small{display:block;margin-top:18px;color:var(--mut);line-height:1.5}
.lbox .alt{margin-top:18px;color:var(--mut);font-size:.9rem}
.lbox .alt a{color:#fff;cursor:pointer}

/* ============ MENU / ACCOUNT / REQUEST / CONTACT ============ */
.mwrap{position:relative}
.mwrap .ico{position:relative;width:34px;height:34px}
.mwrap .ico svg{fill:#fff;stroke:none}
.mwrap .menu{min-width:240px;white-space:nowrap}
.gated .links,.gated .search,.gated #lbtn{display:none!important}
.mdot{display:none;position:absolute;top:-2px;right:-3px;min-width:16px;height:16px;border-radius:9px;background:var(--red);font-size:.65rem;font-weight:800;place-items:center;padding:0 4px}
.bdg{display:none;background:var(--red);border-radius:9px;font-size:.7rem;font-weight:800;padding:1px 7px;margin-left:8px}
.lbox select,.pbox select,.pbox input,.pbox textarea{width:100%;background:#2b2b33;border:1px solid transparent;border-radius:5px;padding:13px 14px;color:#fff;font-size:1rem;margin-bottom:14px;outline:0;font-family:inherit}
.pbox select:focus,.pbox input:focus,.pbox textarea:focus{border-color:var(--red)}
.lbox .sub,.pbox .sub{color:var(--mut);line-height:1.5;font-size:.92rem;margin:0 0 16px}
.err{color:#ff6b6b;font-size:.88rem;min-height:1.2em;margin:-4px 0 8px;line-height:1.4}
.okm{color:#46d369;font-size:.88rem;min-height:1.2em;margin:-4px 0 8px}
.otp{text-align:center;letter-spacing:10px;font-size:1.6rem!important;font-weight:800}
.btn.wide{width:100%;justify-content:center;margin-top:10px}
.btn:disabled{opacity:.55;cursor:default}
.acc{display:flex;gap:14px;align-items:center;margin-bottom:20px}
.av2{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7a0510);display:grid;place-items:center;font-size:1.5rem;font-weight:800}
.pbox{max-width:680px;margin:0 auto}
.pbox h3{margin:30px 0 12px}
.pbox .card{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:20px}
.pbox label{display:block;color:var(--mut);font-size:.82rem;margin:0 0 6px}
.pbox .card small{display:block;color:var(--mut);margin-top:12px}
.sw{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% - 12px);background:#1b1b22;border:1px solid var(--line);border-radius:8px;z-index:20;overflow:hidden}
.sugg:empty{display:none}
.sg{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;color:#fff}
.sg:hover{background:var(--bg3)}
.sg img,.sg i{width:30px;height:44px;border-radius:3px;object-fit:cover;background:#333;flex:none}
.sg b{flex:1;font-size:.92rem;font-weight:600}
.sg span{color:var(--mut);font-size:.78rem;white-space:nowrap}
.sg.have{background:rgba(70,211,105,.12)}
.sg.have span{color:#46d369}
.rlist .rq{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.rq b{display:block}
.rq span{color:var(--mut);font-size:.8rem}
.rq em{font-style:normal;font-size:.8rem;font-weight:700;white-space:nowrap;padding:4px 10px;border-radius:20px;background:#2b2b33}
.rq em.added{background:rgba(70,211,105,.18);color:#46d369}
.rq em.rejected{background:rgba(255,107,107,.15);color:#ff6b6b}
.rq em.working{background:rgba(255,193,7,.15);color:#ffc107}
.owner{display:flex;gap:16px;align-items:center;margin-bottom:14px}
.op{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--red),#7a0510);display:grid;place-items:center;font-size:2rem;font-weight:800;overflow:hidden;position:relative;flex:none}
.op img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.about{line-height:1.7;color:#ddd;white-space:pre-wrap;margin:0 0 16px}
.thread{max-height:420px;overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px}
.bub{max-width:85%;padding:10px 14px;border-radius:12px;background:#2b2b33}
.bub.a{align-self:flex-start;background:#3a0f14;border:1px solid #5a1a20}
.bub.u{align-self:flex-end}
.bub b{font-size:.78rem;color:var(--mut)}
.bub p{margin:4px 0;white-space:pre-wrap;word-break:break-word;line-height:1.5}
.bub span{font-size:.7rem;color:var(--mut)}
.upd{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.upd.new{border-color:var(--red)}
.upd .uh{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem}
.upd .uh span{color:var(--mut);font-weight:400;font-size:.78rem}
.upd p{margin:8px 0 0;white-space:pre-wrap;line-height:1.6;word-break:break-word}
.upd a{color:var(--red);font-size:.88rem;display:inline-block;margin-top:8px}

/* ============ MISC ============ */
.sk{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:6px}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#fff;color:#000;padding:10px 20px;border-radius:30px;font-weight:600;font-size:.9rem;opacity:0;transition:all .3s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
footer{padding:30px var(--pad) 40px;color:var(--mut);font-size:.8rem;border-top:1px solid var(--line);text-align:center}
.fade{animation:fi .35s ease}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

@media(max-width:760px){
  :root{--pad:14px;--nav-h:56px}
  .nav{gap:12px;flex-wrap:nowrap}
  .logo{font-size:1.15rem}
  .links{position:fixed;top:var(--nav-h);left:0;right:0;background:rgba(11,11,15,.97);padding:10px var(--pad);gap:18px;border-bottom:1px solid var(--line);z-index:49}
  .nav.hide-links .links{display:none}
  .din{flex-direction:column;align-items:flex-start;gap:16px}
  .din .poster{width:120px}
  .hero{height:72vh}
  .dots{display:none}
  .btn{padding:9px 16px;font-size:.92rem}
  .lbox{padding:32px 22px}
  .top .num{-webkit-text-stroke:2px #6c6c78}
}
</style>
</head>
<body>

<header class="nav" id="nav">
  <a class="logo" href="#/" id="logo">AstraToonix</a>
  <nav class="links" id="links">
    <a href="#/" data-r="home">Home</a>
    <a href="#/c/Series" data-r="Series">TV Shows</a>
    <a href="#/c/Movie" data-r="Movie">Movies</a>
    <a href="#/c/Anime" data-r="Anime">Anime</a>
    <a href="#/c/Cartoon" data-r="Cartoon">Cartoon</a>
    <a href="#/c/Other" data-r="Other">Other</a>

<script>
(function(){
"use strict";
/* ============ small helpers ============ */
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var app=$('#app'), SITE='AstraToonix';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ls(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2200)}
function fmtSize(b){if(!b)return'';var u=['B','KB','MB','GB'],i=0;while(b>=1024&&i<3){b/=1024;i++}return b.toFixed(i?1:0)+' '+u[i]}
var DEFQ='low',ACC=false,GATE=false,ME=null,OWNER={},pageTimer=0;
function pickF(fs){return DEFQ==='high'?fs[0]:fs[fs.length-1]}
function cid(){var c=ls('atx-cid',null);if(!c){c='';for(var i=0;i<16;i++)c+=Math.floor(Math.random()*16).toString(16);ss('atx-cid',c)}return c}
function api(p){return fetch(p,{headers:{'X-Cid':cid()},credentials:'same-origin'}).then(function(r){if(r.status===401&&GATE&&ME){ME=null;paintProfile();route()}if(!r.ok)throw new Error(r.status);return r.json()})}
function post(p,b){return fetch(p,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Cid':cid()},body:JSON.stringify(b||{})}).then(function(r){return r.json().catch(function(){return {}}).then(function(j){if(!r.ok){var e=new Error(j.error||'Dikkat aayi, dobara try karo.');e.data=j;throw e}return j})},function(){throw new Error('Internet check karo, server tak nahi pahunch paaye.')})}
function fmtT(t){try{return new Date(t).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
var ICON={
 play:'<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg>',
 info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 like:'<svg viewBox="0 0 24 24"><path d="M7 11v9H4v-9h3zm2 9V10.5l4-7c1.2 0 2 .9 2 2V9h5a2 2 0 012 2.3l-1.3 7a2 2 0 01-2 1.7H9z"/></svg>'
};
function grad(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%360;return 'linear-gradient(135deg,hsl('+h+',55%,28%),hsl('+((h+50)%360)+',60%,14%))'}
function poster(c){
  if(c.poster)return '<img loading="lazy" src="'+esc(c.poster)+'" alt="" onerror="this.parentNode.innerHTML=window.__noimg(this.getAttribute(\'data-t\'))" data-t="'+esc(c.title)+'">';
  return window.__noimg(c.title);
}
var THUMB='';
window.__noimg=function(t){if(THUMB)return '<div class="noimg" style="background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.72)),url(\''+esc(THUMB)+'\') center/cover">'+esc(t||'')+'</div>';return '<div class="noimg" style="background:'+grad(t||'x')+'">'+esc(t||'')+'</div>'};

/* ============ my list / likes / history ============ */
function getList(){return ls('atx-list',[])}
function inList(k){return getList().some(function(x){return x.key===k})}
function toggleList(c){var l=getList(),i=l.findIndex(function(x){return x.key===c.key});
  if(i>=0){l.splice(i,1);toast('My List se hata diya')}else{l.unshift({key:c.key,title:c.title,year:c.year,rating:c.rating,poster:c.poster,backdrop:c.backdrop,category:c.category,kind:c.kind});toast('My List mein jod diya ✓')}
  ss('atx-list',l);markDirty();return i<0}
function getLikes(){return ls('atx-likes',[])}
function toggleLike(k){var l=getLikes(),i=l.indexOf(k);if(i>=0)l.splice(i,1);else l.push(k);ss('atx-likes',l);markDirty();return i<0}
function getCW(){return ls('atx-cw',[])}

/* ============ navbar ============ */
var nav=$('#nav');
function onScroll(){nav.classList.toggle('solid',window.scrollY>20)}
window.addEventListener('scroll',onScroll,{passive:true});onScroll();
var sbox=$('#search'),sin=$('#sin');
$('#sbtn').onclick=function(){sbox.classList.toggle('open');if(sbox.classList.contains('open')){sin.focus()}else if(!sin.value){}};
var st;sin.addEventListener('input',function(){clearTimeout(st);var v=sin.value.trim();st=setTimeout(function(){if(v)location.hash='#/s/'+encodeURIComponent(v);else if(/^#\/s\//.test(location.hash))location.hash='#/'},320)});
sin.addEventListener('keydown',function(e){if(e.key==='Escape'){sin.value='';sbox.classList.remove('open');sin.blur()}});
$('#av').onclick=function(e){e.stopPropagation();$('#mmenu').classList.remove('show');$('#menu').classList.toggle('show')};
$('#mbtn').onclick=function(e){e.stopPropagation();$('#menu').classList.remove('show');$('#mmenu').classList.toggle('show')};
$('#lout').onclick=function(){doLogout()};
document.addEventListener('click',function(){$('#menu').classList.remove('show');$('#mmenu').classList.remove('show')});
$('#clr').onclick=function(){ss('atx-cw',[]);markDirty();toast('Watch history saaf ✓');if(!location.hash||location.hash==='#/')route()};
$('#lbtn').onclick=function(){nav.classList.toggle('hide-links')};
function profile(){return ls('atx-profile',null)}
function paintProfile(){
  var p=ACC?ME:profile(),nm=p&&p.name?p.name:'';
  $('#av').textContent=(nm||'G').charAt(0).toUpperCase();
  $('#who').textContent=nm?('Hi, '+nm):'Guest';
  document.body.classList.toggle('gated',GATE&&!ME);
  var l=$('#lnk');if(l)l.textContent=ACC&&ME?'My Account':'Sign in / Profile';
  var o=$('#lout');if(o)o.style.display=ACC&&ME?'block':'none';
}
/* ============ sync (account ke saath My List / Likes / Continue Watching) ============ */
var syncT;
function isDirty(){try{return !!localStorage.getItem('atx-dirty')}catch(e){return false}}
function markDirty(){if(!ME)return;try{localStorage.setItem('atx-dirty','1')}catch(e){}clearTimeout(syncT);syncT=setTimeout(pushSync,2500)}
function pushSync(){if(!ME)return Promise.resolve();return post('/api/sync',{list:getList(),likes:getLikes(),cw:getCW()}).then(function(r){ss('atx-sver',r.ver);try{localStorage.removeItem('atx-dirty')}catch(e){}}).catch(function(){})}
function applySync(s,merge){
  if(!s)return;
  var sv=ls('atx-sver',-1);
  if(!merge&&!isDirty()){if(s.ver!==sv){ss('atx-list',s.list||[]);ss('atx-likes',s.likes||[]);ss('atx-cw',s.cw||[]);ss('atx-sver',s.ver)}return}
  if(!merge&&s.ver===sv){pushSync();return}
  var L=getList();(s.list||[]).forEach(function(x){if(!L.some(function(y){return y.key===x.key}))L.push(x)});
  var K=getLikes();(s.likes||[]).forEach(function(x){if(K.indexOf(x)<0)K.push(x)});
  var C=getCW();(s.cw||[]).forEach(function(x){var i=-1;C.forEach(function(y,j){if(y.key===x.key)i=j});if(i<0)C.push(x);else if((x.ts||0)>(C[i].ts||0))C[i]=x});
  C.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
  ss('atx-list',L);ss('atx-likes',K);ss('atx-cw',C.slice(0,24));ss('atx-sver',s.ver);
  try{localStorage.setItem('atx-dirty','1')}catch(e){}
  pushSync();
}
function loadMe(){return api('/api/me').then(function(r){ME=r.user||null;if(ME){try{localStorage.setItem('atx-acct','1')}catch(e){}applySync(r.sync,false)}else{try{localStorage.removeItem('atx-acct')}catch(e){}}}).catch(function(){})}
function afterAuth(user,msg){
  ME=user;try{localStorage.setItem('atx-acct','1')}catch(e){}
  return api('/api/me').then(function(r){applySync(r.sync,true)}).catch(function(){}).then(function(){paintProfile();pollInbox();toast(msg||('Swagat hai, '+user.name+' 👋'));
    var nx=null;try{nx=sessionStorage.getItem('atx-next');sessionStorage.removeItem('atx-next')}catch(e){}
    if(nx&&nx.charAt(0)==='/'){location.href=nx;return}
    location.hash=(nx&&nx.charAt(0)==='#')?nx:'#/';route()});
}
function doLogout(){
  pushSync().then(function(){return post('/api/auth/logout',{})}).catch(function(){}).then(function(){
    ME=null;['atx-list','atx-likes','atx-cw','atx-sver','atx-dirty','atx-acct'].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});
    paintProfile();pollInbox();toast('Sign out ho gaye');location.hash='#/';route();
  });
}
/* ============ inbox: updates + owner ke jawab + request status ============ */
var INBOX={updates:[],thread:[],requests:[]};
function feed(){var f=[];(INBOX.updates||[]).forEach(function(u){f.push({k:'u',t:Date.parse(u.t),text:u.text})});(INBOX.thread||[]).forEach(function(m){if(m.dir==='a')f.push({k:'r',t:Date.parse(m.t),text:m.text,auto:m.auto})});f.sort(function(a,b){return b.t-a.t});return f}
function paintBadge(){
  var f=feed(),s=ls('atx-seen',null);
  if(s===null){s=f.length?f[0].t:1;ss('atx-seen',s)}
  var n=f.filter(function(x){return x.t>s}).length;
  var d=$('#mdot');d.style.display=n?'grid':'none';d.textContent=n>9?'9+':n;
  var b=$('#ubdg');if(b){b.style.display=n?'inline-block':'none';b.textContent=n}
}
function markSeen(){var f=feed();if(f.length)ss('atx-seen',f[0].t);paintBadge()}
function pollInbox(){return api('/api/inbox').then(function(d){INBOX=d;paintBadge()}).catch(function(){})}
paintProfile();
if(window.innerWidth<=760){$('#lbtn').style.display='grid';nav.classList.add('hide-links')}

/* ============ cards + rows ============ */
function cardHTML(c,opt){
  opt=opt||{};
  var cls='card'+(opt.na?' na':'')+(opt.cur?' cur':'');
  var badge=c.category&&c.category!=='Movie'?'<span class="badge">'+esc(c.category==='Series'?'TV':c.category)+'</span>':'';
  var meta=[];if(c.rating)meta.push('<span class="rate">★ '+c.rating.toFixed(1)+'</span>');if(c.year)meta.push(c.year);
  var inl=inList(c.key);
  var prog=opt.pct!=null?'<div class="prog"><i style="width:'+opt.pct+'%"></i></div>':'';
  var num=opt.rank?'<span class="num">'+opt.rank+'</span>':'';
  return '<div class="'+cls+'" data-key="'+esc(c.key||'')+'" '+(opt.href?'data-href="'+esc(opt.href)+'"':'')+'>'+num+
    '<div class="ph">'+poster(c)+badge+
    '<div class="ov"><div class="t">'+esc(c.title)+'</div><div class="m">'+meta.join(' ')+'</div>'+
    (opt.nobtn?'':'<div class="a"><button class="rb pl" data-act="play" aria-label="Play">'+ICON.play+'</button>'+
    '<button class="rb st'+(inl?' on':'')+'" data-act="list" aria-label="My List">'+(inl?ICON.check:ICON.plus)+'</button>'+
    '<button class="rb" data-act="info" aria-label="More info"><svg viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:2.4"><path d="M6 9l6 6 6-6"/></svg></button></div>')+
    '</div>'+prog+'</div>'+(opt.sub?'<div class="cwl">'+esc(opt.sub)+'</div>':'')+'</div>';
}
var cardData={};
function reg(list){list.forEach(function(c){cardData[c.key]=c})}

function rowHTML(name,items,opt){
  opt=opt||{};
  var inner=items.map(function(c,i){return cardHTML(c,{rank:opt.top?i+1:0})}).join('');
  return '<section class="row'+(opt.top?' top':'')+'"><h2>'+esc(name)+(opt.link?' <a href="'+opt.link+'">Sab dekho ›</a>':'')+'</h2>'+
   '<div class="track-wrap"><button class="arrow l" aria-label="Left">‹</button><div class="track">'+inner+'</div><button class="arrow r" aria-label="Right">›</button></div></section>';
}

/* one delegated handler for cards, arrows */
document.addEventListener('click',function(e){
  var ar=e.target.closest('.arrow');
  if(ar){var tr=ar.parentNode.querySelector('.track');tr.scrollBy({left:(ar.classList.contains('l')?-1:1)*tr.clientWidth*.85,behavior:'smooth'});return}
  var card=e.target.closest('.card');if(!card||card.classList.contains('na'))return;
  if(dragMoved){dragMoved=false;return}
  var act=e.target.closest('[data-act]'),key=card.getAttribute('data-key'),href=card.getAttribute('data-href');
  if(act){e.stopPropagation();var a=act.getAttribute('data-act');
    if(a==='play'){playTitle(key)}
    else if(a==='list'){var c=cardData[key];if(c){var on=toggleList(c);act.classList.toggle('on',on);act.innerHTML=on?ICON.check:ICON.plus;if(/^#\/list/.test(location.hash))route()}}
    else if(a==='info'){location.hash='#/t/'+encodeURIComponent(key)}
    return}
  if(href){location.href=href;return}
  if(key)location.hash='#/t/'+encodeURIComponent(key);
});
/* mouse drag scroll on tracks */
var dragMoved=false;
(function(){var tr=null,sx=0,sl=0,down=false;
 document.addEventListener('mousedown',function(e){var t=e.target.closest('.track');if(!t||e.button!==0)return;tr=t;down=true;sx=e.pageX;sl=t.scrollLeft;dragMoved=false});
 document.addEventListener('mousemove',function(e){if(!down)return;var dx=e.pageX-sx;if(Math.abs(dx)>6){dragMoved=true;tr.classList.add('drag');tr.scrollLeft=sl-dx}});
 document.addEventListener('mouseup',function(){if(down){down=false;if(tr)tr.classList.remove('drag');setTimeout(function(){dragMoved=false},0)}});
})();

function playTitle(key,fid){
  if(fid){location.href='/w/'+fid;return}
  api('/api/title/'+encodeURIComponent(key)).then(function(d){
    var cw=getCW().filter(function(x){return x.key===key})[0];
    if(cw){location.href='/w/'+cw.fid;return}
    var en=d.entries&&d.entries[0];if(en&&en.files&&en.files.length)location.href='/w/'+pickF(en.files).id;else toast('Abhi koi file nahi hai');
  }).catch(function(){toast('Load nahi hua, dobara try karo')});
}

/* ============ pages ============ */
function setActive(r){$$('#links a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-r')===r)})}
function skeletonHome(){return '<div class="hero sk"></div><div class="rows">'+[1,2,3].map(function(){return '<div class="row"><div class="sk" style="height:22px;width:180px;margin:0 var(--pad) 12px"></div><div class="track" style="overflow:hidden">'+new Array(8).join('<div class="card"><div class="ph sk"></div></div>')+'</div></div>'}).join('')+'</div>'}

var heroTimer=null;
function renderHome(){
  setActive('home');app.innerHTML=skeletonHome();
  api('/api/home').then(function(d){
    clearInterval(heroTimer);
    if(!d.total){app.innerHTML='<div class="page"><div class="empty"><b>Abhi yahan kuch nahi hai</b>Telegram bot ko koi video bhejo — wo yahan khud aa jayegi.</div></div>';return}
    var h='';
    var heroes=d.heroes||[];reg(heroes);
    if(heroes.length){
      h+='<section class="hero" id="hero">'+heroes.map(function(c,i){
        var meta=[];if(c.rating)meta.push('<span class="rate">★ '+c.rating.toFixed(1)+'</span>');if(c.year)meta.push(c.year);meta.push('<span class="chip">'+esc(c.category==='Series'?'TV Show':c.category)+'</span>');
        (c.genres||[]).slice(0,3).forEach(function(g){meta.push(esc(g))});
        return '<div class="slide'+(i?'':' on')+'" data-key="'+esc(c.key)+'"><div class="bd" style="background-image:url(\''+esc(c.backdrop)+'\')"></div><div class="hero-in"><h1>'+esc(c.title)+'</h1><div class="meta">'+meta.join('<span>•</span>')+'</div><p class="desc">'+esc(c.overview||'')+'</p>'+
          '<div class="btns"><button class="btn play" data-h="play">'+ICON.play+' Play</button><button class="btn info" data-h="info">'+ICON.info+' More Info</button></div></div></div>'}).join('')+
        (heroes.length>1?'<div class="dots">'+heroes.map(function(_,i){return '<i class="'+(i?'':'on')+'" data-i="'+i+'"></i>'}).join('')+'</div>':'')+'</section>';
    } else {h+='<div style="height:var(--nav-h)"></div>'}
    h+='<main><div class="rows" '+(heroes.length?'':'style="margin-top:20px"')+'>';
    // continue watching
    var cw=getCW();
    if(cw.length){
      h+='<section class="row"><h2>Continue Watching</h2><div class="track-wrap"><button class="arrow l">‹</button><div class="track">'+cw.slice(0,20).map(function(x){
        var pct=x.dur?Math.min(100,Math.round(x.pos/x.dur*100)):0;
        return cardHTML({key:x.key,title:x.title,poster:x.poster,category:'',year:0},{href:'/w/'+x.fid,pct:pct,sub:x.label||'',nobtn:true})}).join('')+'</div><button class="arrow r">›</button></div></section>';
    }
    (d.rows||[]).forEach(function(r){reg(r.items);
      var link=null;if(r.slug.indexOf('cat:')===0)link='#/c/'+r.slug.slice(4);else if(r.slug.indexOf('genre:')===0)link='#/g/'+encodeURIComponent(r.slug.slice(6));
      h+=rowHTML(r.name,r.items,{top:r.slug==='top',link:link})});
    h+='</div></main><footer>© '+esc(SITE)+' · Stream the Universe</footer>';
    app.innerHTML=h;app.classList.add('fade');
    initHero();
  }).catch(function(){app.innerHTML='<div class="page"><div class="empty"><b>Load nahi ho paya</b>Thodi der baad refresh karo.</div></div>'});
}
function initHero(){
  var hero=$('#hero');if(!hero)return;var sl=$$('.slide',hero),dots=$$('.dots i',hero),i=0;
  function go(n){sl[i].classList.remove('on');if(dots[i])dots[i].classList.remove('on');i=(n+sl.length)%sl.length;sl[i].classList.add('on');if(dots[i])dots[i].classList.add('on')}
  if(sl.length>1)heroTimer=setInterval(function(){if(document.hidden)return;if(!document.body.contains(hero)){clearInterval(heroTimer);return}go(i+1)},8000);
  dots.forEach(function(d){d.onclick=function(){go(+d.getAttribute('data-i'));clearInterval(heroTimer)}});
  hero.addEventListener('click',function(e){var b=e.target.closest('[data-h]');if(!b)return;var k=sl[i].getAttribute('data-key');if(b.getAttribute('data-h')==='play')playTitle(k);else location.hash='#/t/'+encodeURIComponent(k)});
}

var CATNAME={Series:'TV Shows',Movie:'Movies',Anime:'Anime',Cartoon:'Cartoon',Other:'Other'};
function renderBrowse(cat,genre){
  setActive(cat||'');
  var state={sort:'new',genre:genre||'',page:0,items:[]};
  var title=genre?genre:(CATNAME[cat]||'Browse');
  app.innerHTML='<div class="page"><h1>'+esc(title)+'</h1><div class="filters" id="flt"></div><div class="grid" id="grid"></div><button class="btn ghost more" id="more" style="display:none">Aur dikhao</button></div>';
  function load(reset){
    if(reset){state.page=0;state.items=[]}
    api('/api/browse?cat='+encodeURIComponent(cat||'')+'&genre='+encodeURIComponent(state.genre)+'&sort='+state.sort+'&page='+state.page).then(function(d){
      reg(d.items);state.items=state.items.concat(d.items);
      if(reset||!$('#flt').innerHTML){
        var gs=(d.genres||[]).slice(0,14);
        $('#flt').innerHTML='<button class="fchip'+(state.genre?'':' on')+'" data-g="">All</button>'+gs.map(function(g){return '<button class="fchip'+(state.genre===g?' on':'')+'" data-g="'+esc(g)+'">'+esc(g)+'</button>'}).join('')+
          '<select class="sel" id="srt"><option value="new">Newest</option><option value="popular">Most watched</option><option value="rating">Top rated</option><option value="az">A – Z</option></select>';
        $('#srt').value=state.sort;
        $('#srt').onchange=function(){state.sort=this.value;load(true)};

function setErr(m){var e=$('#er');if(e){e.className='err';e.textContent=m||''}}
function setOk(m){var e=$('#er');if(e){e.className='okm';e.textContent=m||''}}
function submit(form,fn){
  form.onsubmit=function(ev){ev.preventDefault();var b=$('button[type=submit]',form);if(b.disabled)return;b.disabled=true;var t=b.textContent;b.textContent='Ruko…';setErr('');
    Promise.resolve().then(fn).catch(function(e){setErr(e.message)}).then(function(){if(document.body.contains(b)){b.disabled=false;b.textContent=t}})};
}
function resendBtn(btn,fn){
  var left=45,tm;
  function tick(){if(!document.body.contains(btn)){clearInterval(tm);return}if(left>0){btn.disabled=true;btn.textContent='Naya OTP bhejo ('+left+'s)';left--}else{btn.disabled=false;btn.textContent='Naya OTP bhejo';clearInterval(tm)}}
  tm=setInterval(tick,1000);tick();
  btn.onclick=function(){btn.disabled=true;setErr('');fn().then(function(){setOk('Naya OTP bhej diya ✓ (spam folder bhi dekho)');left=45;clearInterval(tm);tm=setInterval(tick,1000);tick()}).catch(function(e){setErr(e.message);btn.disabled=false})};
}

      $('#eps').innerHTML=list.map(function(e){
        var pf=pickF(e.files);
        return '<div class="ep" data-fid="'+pf.id+'"><div class="pn">'+ICON.play+'</div><div class="lb">'+esc(e.label||t.title)+'</div><div class="nm">'+esc(pf.name)+'</div><div class="qs">'+
          e.files.map(function(f){return '<button class="q" data-fid="'+f.id+'" title="'+esc(fmtSize(f.size))+'">'+esc(f.quality)+(f.size?' · '+esc(fmtSize(f.size)):'')+'</button>'}).join('')+'</div></div>'}).join('');
    }
    paintEps(snums.length>1||(snums.length===1&&snums[0]>0&&entries.length>1)?snums[0]:undefined);
    $('#eps').onclick=function(e){var q=e.target.closest('.q'),ep=e.target.closest('.ep');if(q){location.href='/w/'+q.getAttribute('data-fid');return}if(ep)location.href='/w/'+ep.getAttribute('data-fid')};
    var ssn=$('#ssn');if(ssn)ssn.onclick=function(e){var b=e.target.closest('.fchip');if(!b)return;$$('.fchip',ssn).forEach(function(x){x.classList.toggle('on',x===b)});paintEps(+b.getAttribute('data-s'))};
    var dp=$('#dp');if(dp)dp.onclick=function(){location.href='/w/'+playId};
    $('#dl').onclick=function(){var on=toggleList(t);this.classList.toggle('on',on);this.innerHTML=(on?ICON.check:ICON.plus)+' My List'};
    $('#dk').onclick=function(){var on=toggleLike(key);this.classList.toggle('on',on);toast(on?'Pasand aaya 👍':'Like hata diya')};
  }).catch(function(){app.innerHTML='<div class="page"><div class="empty"><b>Title nahi mila</b><a href="#/" style="color:var(--red)">Home par jao</a></div></div>'});
}

/* ============ router ============ */
function route(){
  clearInterval(pageTimer);clearInterval(heroTimer);document.title=SITE;app.classList.remove('fade');
  if(window.innerWidth<=760)nav.classList.add('hide-links');
  var h=location.hash||'#/',m;
  window.scrollTo(0,0);
  if(GATE&&!ME&&h!=='#/contact'){if(h!=='#/'&&h!=='#'&&h!=='#/login'){try{sessionStorage.setItem('atx-next',h)}catch(e){}}renderLogin();return}
  if(h==='#/'||h==='#')renderHome();
  else if((m=h.match(/^#\/c\/([^/]+)/)))renderBrowse(decodeURIComponent(m[1]),'');
  else if((m=h.match(/^#\/g\/(.+)/)))renderBrowse('',decodeURIComponent(m[1]));
  else if((m=h.match(/^#\/t\/(.+)/)))renderTitle(decodeURIComponent(m[1]));
  else if((m=h.match(/^#\/s\/(.+)/)))renderSearch(decodeURIComponent(m[1]));
  else if(h==='#/list')renderList();
  else if(h==='#/login')renderLogin();
  else if(h==='#/request')renderRequest();
  else if(h==='#/contact')renderContact();
  else if(h==='#/updates')renderUpdates();
  else renderHome();
}
window.addEventListener('hashchange',route);
try{var nq=new URLSearchParams(location.search).get('next');if(nq&&/^\/w\/\d+$/.test(nq)){sessionStorage.setItem('atx-next',nq);history.replaceState(null,'','/'+location.hash)}}catch(e){}
api('/api/config').then(function(c){if(!c)return;if(c.thumb)THUMB=c.thumb;ACC=!!c.accounts;GATE=ACC&&!!c.gate;if(c.defq==='high')DEFQ='high';OWNER=c.owner||{};if(c.site){SITE=c.site;$('#logo').textContent=c.site;document.title=c.site}if(c.logo){var im=new Image();im.className='logoimg';im.alt=SITE;im.onload=function(){$('#logo').textContent='';$('#logo').appendChild(im)};im.src=c.logo}}).catch(function(){}).then(function(){return ACC?loadMe():0}).then(function(){paintProfile();route();pollInbox();setInterval(function(){if(!document.hidden)pollInbox()},30000)});
})();
</script>
