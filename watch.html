<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Watch</title>
<style>
:root{--bg:#0b0b0f;--bg2:#14141a;--bg3:#1d1d26;--line:#2a2a35;--text:#f2f2f5;--mut:#9a9aa8;--red:#E50914;--pad:4vw}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
.top{display:flex;align-items:center;gap:14px;padding:12px var(--pad);position:sticky;top:0;background:rgba(11,11,15,.94);z-index:20;backdrop-filter:blur(8px)}
.logoimg{height:30px;width:auto;display:block;max-width:170px;object-fit:contain}
.top a.logo{font-weight:900;color:var(--red);text-transform:uppercase;letter-spacing:.5px;font-size:1.2rem}
.top .sp{flex:1}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:.86rem;transition:all .2s}
.pill:hover{background:#fff;color:#000}
.wrap{max-width:1280px;margin:0 auto;padding:0 var(--pad) 50px}
.pw{position:relative;background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;max-height:80vh;box-shadow:0 10px 40px rgba(0,0,0,.6)}
video,audio{width:100%;height:100%;display:block;background:#000;outline:0}
.audioBox{display:grid;place-items:center;height:100%;padding:20px}
.nx{position:absolute;right:16px;bottom:70px;background:rgba(15,15,20,.95);border:1px solid #444;border-radius:10px;padding:14px 16px;display:none;z-index:5;max-width:min(320px,80%)}
.nx.show{display:block;animation:fi .25s ease}
.nx b{display:block;margin-bottom:4px}.nx small{color:var(--mut)}
.nx .r{display:flex;gap:8px;margin-top:10px}
.btn{border:0;border-radius:6px;padding:8px 16px;font-weight:700;font-size:.9rem}
.btn.w{background:#fff;color:#000}.btn.g{background:#333;color:#fff}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.err{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;background:rgba(0,0,0,.85);z-index:4;color:#ddd}
.err.show{display:grid}
.info{padding:18px 0 6px}
.info h1{font-size:clamp(1.2rem,2.6vw,1.8rem);margin:0 0 6px}
.info .lb{color:var(--red);font-weight:800;margin-right:8px}
.info .meta{color:var(--mut);font-size:.88rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rate{color:#46d369;font-weight:800}
.chip{border:1px solid #666;border-radius:3px;padding:0 6px;font-size:.76rem;color:#ccc}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0;align-items:center}
.q{background:#000;border:1px solid #555;border-radius:20px;padding:6px 14px;font-size:.84rem}
.qh{font-size:.8rem;color:var(--mut);margin:18px 0 8px;letter-spacing:.4px;text-transform:uppercase}
.qgrid{display:flex;gap:10px;flex-wrap:wrap}
.qbox{position:relative;width:clamp(128px,22vw,176px);aspect-ratio:16/9;border-radius:8px;overflow:hidden;border:2px solid transparent;background:var(--bg3);cursor:pointer;padding:0;transition:transform .2s,border-color .2s}
.qbox:hover{transform:translateY(-2px);border-color:#777}
.qbox.on{border-color:var(--red);cursor:default}
.qbox .th{position:absolute;inset:0;background-size:cover;background-position:center 25%;filter:brightness(.6)}
.qbox .ql{position:absolute;left:8px;bottom:22px;font-weight:900;font-size:1.15rem;text-shadow:0 2px 8px #000}
.qbox .qs2{position:absolute;left:8px;bottom:6px;font-size:.72rem;color:#ddd;text-shadow:0 1px 4px #000}
.qbox .qn{position:absolute;right:6px;top:6px;background:var(--red);font-size:.64rem;font-weight:800;padding:2px 6px;border-radius:3px}
.qbox .qp{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center}
.qbox .qp svg{width:11px;height:11px;fill:#000}
.q:hover{border-color:#fff}.q.on{background:#fff;color:#000;border-color:#fff}
h3{font-size:1.15rem;margin:28px 0 12px}
.fn{color:var(--mut);font-size:.78rem;margin-top:10px;word-break:break-all}
.ov{color:#cfcfd8;line-height:1.55;max-width:900px;font-size:.95rem;margin:12px 0 0}
.seasons{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ep{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:7px;cursor:pointer;transition:all .2s}
.ep:hover{background:var(--bg3);border-color:#444}
.ep.cur{border-color:var(--red);background:#1c1014}
.ep .lb2{font-weight:700;min-width:64px}
.ep .nm{flex:1;color:var(--mut);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ep .now{font-size:.72rem;color:var(--red);font-weight:800}
.track{display:flex;gap:8px;overflow-x:auto;scrollbar-width:thin;padding-bottom:8px}
.card{flex:0 0 clamp(108px,14vw,160px);cursor:pointer;transition:transform .2s}
.card:hover{transform:scale(1.05)}
.card .ph{aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--bg3);position:relative}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{width:100%;height:100%;display:grid;place-items:center;padding:8px;text-align:center;font-weight:800;font-size:.85rem;line-height:1.2}
.card .cl{font-size:.76rem;color:var(--mut);margin-top:5px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card.na{opacity:.4;filter:grayscale(.8);cursor:default}.card.na:hover{transform:none}
.card.cur .ph{outline:2px solid var(--red)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:#fff;color:#000;padding:10px 20px;border-radius:30px;font-weight:600;font-size:.9rem;opacity:0;transition:all .3s;z-index:100;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<div class="top">
  <a class="logo" href="/" id="logo">AstraToonix</a>
  <div class="sp"></div>
  <a class="pill" href="/" id="homeBtn">🏠 Home</a>
  <a class="pill" href="/" id="titleBtn" style="display:none">ⓘ Details</a>
</div>

<div class="wrap">
  <div class="pw" id="pw">
    <video id="v" controls autoplay playsinline preload="metadata"></video>
    <div class="err" id="err"><div><b>Video nahi chal pa rahi</b><br><small>Thodi der baad refresh karo. Agar phir bhi na chale to “Download” try karo.</small></div></div>
    <div class="nx" id="nx"><b id="nxt">Agla episode</b><small id="nxs"></small><div class="r"><button class="btn w" id="nxgo">Abhi chalao</button><button class="btn g" id="nxno">Cancel</button></div></div>
  </div>

  <div class="info">
    <h1 id="ttl">Loading…</h1>
    <div class="meta" id="meta"></div>
    <div id="qbar"></div>
    <div class="bar">
      <a class="pill" id="dl" href="#">⬇️ Download</a>
      <button class="pill" id="cp" type="button">🔗 Link copy</button>
    </div>
    <div class="fn" id="fn"></div>
    <p class="ov" id="ovw"></p>
  </div>

  <div id="eps"></div>
  <div id="parts"></div>
  <div id="sim"></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var ID=parseInt(location.pathname.replace(/\D+/g,' ').trim().split(' ')[0],10);
var v=$('#v'),fv=null,startTime=0,viewSent=false,lastSave=0,nextTimer=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ls(k,d){try{var x=localStorage.getItem(k);return x?JSON.parse(x):d}catch(e){return d}}
function ss(k,x){try{localStorage.setItem(k,JSON.stringify(x))}catch(e){}}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show')},2000)}
function qrank(q){return {'4K':5,'1080p':4,'720p':3,'HD':2,'480p':2,'360p':1,'CAM':0}[q]||2}
function fmtSize(b){if(!b)return'';var u=['B','KB','MB','GB'],i=0;while(b>=1024&&i<3){b/=1024;i++}return b.toFixed(i?1:0)+' '+u[i]}
function grad(t){var h=0;for(var i=0;i<t.length;i++)h=(h*31+t.charCodeAt(i))%360;return 'linear-gradient(135deg,hsl('+h+',55%,28%),hsl('+((h+50)%360)+',60%,14%))'}
var THUMB='';
window.__noimg=function(t){if(THUMB)return '<div class="noimg" style="background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.72)),url(\''+esc(THUMB)+'\') center/cover">'+esc(t||'')+'</div>';return '<div class="noimg" style="background:'+grad(t||'x')+'">'+esc(t||'')+'</div>'};
function pimg(p,t){return p?'<img loading="lazy" src="'+esc(p)+'" alt="" data-t="'+esc(t)+'" onerror="this.parentNode.innerHTML=window.__noimg(this.getAttribute(\'data-t\'))">':window.__noimg(t)}

/* ---- player setup ---- */
v.src='/s/'+ID;
$('#dl').href='/d/'+ID;
$('#cp').onclick=function(){var u=location.origin+'/w/'+ID;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast('Link copy ho gaya ✓')}).catch(function(){prompt('Link copy karo:',u)})};
v.addEventListener('error',function(){$('#err').classList.add('show')});
v.addEventListener('playing',function(){$('#err').classList.remove('show');if(!viewSent){viewSent=true;try{fetch('/api/view/'+ID,{method:'POST',keepalive:true})}catch(e){}}});

/* resume position (har file ka alag) */
var posKey='atx-pos-'+ID;
var saved=ls(posKey,0);
v.addEventListener('loadedmetadata',function(){
  var t=parseInt(new URLSearchParams(location.search).get('t')||'',10);
  var from=!isNaN(t)?t:saved;
  if(from>5&&v.duration&&from<v.duration-15){try{v.currentTime=from}catch(e){}toast('Wahin se chalu: '+Math.floor(from/60)+':'+('0'+Math.floor(from%60)).slice(-2))}
});

/* ---- continue watching ---- */
function saveCW(force){
  var now=Date.now();if(!force&&now-lastSave<5000)return;lastSave=now;
  if(!v.duration||!isFinite(v.duration))return;
  ss(posKey,v.currentTime);
  if(!fv||!fv.title)return;
  var list=ls('atx-cw',[]).filter(function(x){return x.key!==fv.title.key});
  if(v.currentTime>8&&v.currentTime<v.duration-20){
    list.unshift({fid:ID,key:fv.title.key,title:fv.title.title,poster:fv.title.poster,label:fv.label||'',pos:v.currentTime,dur:v.duration,ts:now});
  }
  ss('atx-cw',list.slice(0,24));
  syncCW(force&&now===lastSave&&document.visibilityState==='hidden');
}
/* login hai toh Continue Watching account mein bhi save */
var syncTm;
function syncCW(now){
  try{if(!localStorage.getItem('atx-acct'))return;localStorage.setItem('atx-dirty','1')}catch(e){return}
  clearTimeout(syncTm);
  var go=function(){try{fetch('/api/sync',{method:'POST',keepalive:true,credentials:'same-origin',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({list:ls('atx-list',[]),likes:ls('atx-likes',[]),cw:ls('atx-cw',[])})}).then(function(r){return r.ok?r.json():null}).then(function(j){if(j){ss('atx-sver',j.ver);localStorage.removeItem('atx-dirty')}}).catch(function(){})}catch(e){}};
  if(now)go();else syncTm=setTimeout(go,6000);
}
v.addEventListener('timeupdate',function(){saveCW(false);checkNext()});
v.addEventListener('pause',function(){saveCW(true)});
window.addEventListener('pagehide',function(){saveCW(true)});
document.addEventListener('visibilitychange',function(){if(document.hidden)saveCW(true)});

/* ---- next episode ---- */
var nextShown=false;
function showNext(){
  if(!fv||!fv.next||nextShown)return;nextShown=true;
  $('#nxt').textContent='Up next: '+(fv.next_text||'Agla');
  var n=8;$('#nx').classList.add('show');
  function tick(){$('#nxs').textContent=n+' second mein chalega…';if(n<=0){go();return}n--;nextTimer=setTimeout(tick,1000)}
  function go(){clearTimeout(nextTimer);location.href='/w/'+fv.next.id}
  $('#nxgo').onclick=go;
  $('#nxno').onclick=function(){clearTimeout(nextTimer);$('#nx').classList.remove('show')};
  tick();
}
function checkNext(){}
v.addEventListener('ended',function(){try{ss(posKey,0)}catch(e){}if(fv&&fv.title){var l=ls('atx-cw',[]).filter(function(x){return x.key!==fv.title.key});ss('atx-cw',l);syncCW(false)}showNext()});
/* "Up next" last 25 seconds mein bhi dikhao (skip nahi karta, bas option) */
v.addEventListener('timeupdate',function(){if(fv&&fv.next&&v.duration&&v.duration-v.currentTime<25&&v.duration>120&&!nextShown){$('#nxt').textContent='Up next: '+(fv.next_text||'Agla');$('#nxs').textContent='Video khatam hone par apne aap chalega';$('#nx').classList.add('show');$('#nxgo').onclick=function(){location.href='/w/'+fv.next.id};$('#nxno').onclick=function(){$('#nx').classList.remove('show');nextShown=true}}});

/* ---- keyboard ---- */
document.addEventListener('keydown',function(e){
  if(/INPUT|TEXTAREA|SELECT/.test((e.target||{}).tagName))return;
  var k=e.key;
  if(k===' '||k==='k'){e.preventDefault();v.paused?v.play():v.pause()}
  else if(k==='ArrowRight'){v.currentTime=Math.min((v.duration||1e9),v.currentTime+10)}
  else if(k==='ArrowLeft'){v.currentTime=Math.max(0,v.currentTime-10)}
  else if(k==='ArrowUp'){e.preventDefault();v.volume=Math.min(1,v.volume+.1)}
  else if(k==='ArrowDown'){e.preventDefault();v.volume=Math.max(0,v.volume-.1)}
  else if(k==='f'){document.fullscreenElement?document.exitFullscreen():$('#pw').requestFullscreen&&$('#pw').requestFullscreen()}
  else if(k==='m'){v.muted=!v.muted}
  else if(k==='n'&&fv&&fv.next){location.href='/w/'+fv.next.id}
});

/* ---- info below player ---- */
function card(c,o){o=o||{};
  return '<div class="card'+(o.na?' na':'')+(o.cur?' cur':'')+'" data-key="'+esc(c.key||'')+'"><div class="ph">'+pimg(c.poster,c.title)+'</div><div class="cl">'+esc(c.title)+(c.year?' · '+c.year:'')+(o.sub?'<br><span style="color:#777">'+esc(o.sub)+'</span>':'')+'</div></div>'}
function track(cards){return '<div class="track">'+cards+'</div>'}

function paint(d){
  fv=d;var t=d.title;
  var title=t?t.title:d.file.name;
  $('#ttl').innerHTML=(d.label?'<span class="lb">'+esc(d.label)+'</span>':'')+esc(title);
  document.title=(d.label?d.label+' · ':'')+title;
  var meta=[];
  if(t){if(t.rating)meta.push('<span class="rate">★ '+t.rating.toFixed(1)+'</span>');if(t.year)meta.push(t.year);meta.push('<span class="chip">'+esc(t.category==='Series'?'TV Show':t.category)+'</span>');(t.genres||[]).slice(0,3).forEach(function(g){meta.push(esc(g))})}
  meta.push(esc(d.file.quality)+(d.file.size?' · '+esc(fmtSize(d.file.size)):''));
  $('#meta').innerHTML=meta.join('<span>•</span>');
  $('#fn').textContent=d.file.name;
  if(t&&t.overview)$('#ovw').textContent=t.overview;
  if(t){var tb=$('#titleBtn');tb.style.display='inline-flex';tb.href='/#/t/'+encodeURIComponent(t.key)}

  // quality boxes: thumbnail + quality likha hua (video wahin se chalti rehti hai)
  var qs=[d.file].concat(d.qualities||[]).sort(function(a,b){return (qrank(b.quality)-qrank(a.quality))||((b.size||0)-(a.size||0))});
  var thumb=(t&&(t.backdrop||t.poster))||THUMB||'';
  var bg=thumb?'background-image:url(\''+esc(thumb)+'\')':'background:'+grad((t&&t.title)||d.file.name);
  $('#qbar').innerHTML='<div class="qh">Quality ('+qs.length+')</div><div class="qgrid">'+qs.map(function(f){
    var on=f.id===ID;
    return '<button class="qbox'+(on?' on':'')+'" data-id="'+f.id+'" title="'+esc(f.name)+'"><div class="th" style="'+bg+'"></div>'+
      (on?'<span class="qn">▶ CHAL RAHA HAI</span>':'<span class="qp"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></svg></span>')+
      '<span class="ql">'+esc(f.quality)+'</span><span class="qs2">'+esc(fmtSize(f.size))+'</span></button>'}).join('')+'</div>';
  $('#qbar').onclick=function(e){var b=e.target.closest('.qbox');if(!b)return;var id=+b.getAttribute('data-id');if(id===ID)return;saveCW(true);location.href='/w/'+id+'?t='+Math.floor(v.currentTime||0)};

  // episodes (current season) / parts
  var en=d.entries||[];
  if(en.length>1){
    var cs=d.current>=0?en[d.current].season:0;
    var seasons={};en.forEach(function(e,i){(seasons[e.season||0]=seasons[e.season||0]||[]).push({e:e,i:i})});
    var snums=Object.keys(seasons).map(Number).sort(function(a,b){return a-b});
    var h='<h3>'+(t&&t.kind==='movie'?'Files':'Episodes')+'</h3>';
    if(snums.length>1)h+='<div class="seasons" id="ssn">'+snums.map(function(s){return '<button class="q'+(s===cs?' on':'')+'" data-s="'+s+'">'+(s?'Season '+s:'Other')+'</button>'}).join('')+'</div>';
    h+='<div id="eplist"></div>';
    $('#eps').innerHTML=h;
    var paintEps=function(s){
      $('#eplist').innerHTML=(seasons[s]||[]).map(function(x){
        var cur=x.i===d.current;
        return '<div class="ep'+(cur?' cur':'')+'" data-id="'+x.e.files[0].id+'"><div class="lb2">'+esc(x.e.label||('#'+(x.i+1)))+'</div><div class="nm">'+esc(x.e.files[0].name)+'</div>'+(cur?'<span class="now">▶ Chal raha hai</span>':'')+'</div>'}).join('');
    };
    paintEps(cs);
    $('#eplist').onclick=function(e){var r=e.target.closest('.ep');if(!r)return;var id=+r.getAttribute('data-id');if(id!==ID){saveCW(true);location.href='/w/'+id}};
    var ssn=$('#ssn');if(ssn)ssn.onclick=function(e){var b=e.target.closest('.q');if(!b)return;Array.prototype.forEach.call(ssn.children,function(x){x.classList.toggle('on',x===b)});paintEps(+b.getAttribute('data-s'))};
    setTimeout(function(){var c=document.querySelector('.ep.cur');if(c&&en.length>8)c.scrollIntoView({block:'nearest'})},100);
  }
  if(d.parts&&d.parts.length){
    $('#parts').innerHTML='<h3>'+esc((t&&t.collection_name)||'Aur parts')+'</h3>'+track(d.parts.map(function(p){
      return card({key:p.key||'',title:p.title,year:p.year,poster:p.poster},{na:!p.available,cur:p.current,sub:p.available?(p.current?'Abhi ye':''):'Abhi uploaded nahi'})}).join(''));
  }
  var sh='';
  if(d.similar&&d.similar.length)sh+='<h3>Aapko ye bhi pasand aayega</h3>'+track(d.similar.map(function(c){return card(c)}).join(''));
  var seen={};(d.similar||[]).forEach(function(c){seen[c.key]=1});
  var tr=(d.trending||[]).filter(function(c){return !seen[c.key]});
  if(tr.length)sh+='<h3>Trending on '+esc(document.getElementById('logo').textContent)+'</h3>'+track(tr.map(function(c){return card(c)}).join(''));
  $('#sim').innerHTML=sh;
  document.addEventListener('click',function(e){
    var c=e.target.closest('.card');if(!c||c.classList.contains('na'))return;var k=c.getAttribute('data-key');if(k)location.href='/#/t/'+encodeURIComponent(k);
  });
}

fetch('/api/config').then(function(r){return r.json()}).then(function(c){
  if(c&&c.thumb)THUMB=c.thumb;
  if(c&&c.site)$('#logo').textContent=c.site;
  if(c&&c.logo){var im=new Image();im.className='logoimg';im.alt=c.site||'';im.onload=function(){$('#logo').textContent='';$('#logo').appendChild(im)};im.src=c.logo}
}).catch(function(){}).then(function(){return fetch('/api/file/'+ID)}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(paint).catch(function(){
  $('#ttl').textContent='Video';$('#meta').textContent='';
});
})();
</script>
</body>
</html>
